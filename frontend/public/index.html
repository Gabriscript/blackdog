<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Black Dog — Sala Prove a Firenze. Spazi attrezzati per band, cantautori e produttori. Prenota online, pagamento solo in caso di no-show."
    />
    <title>Black Dog — Sala Prove · Firenze</title>

    <!-- Favicon: quadrato rosso brand su nero (SVG inline, nessun file binario) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23D92D20'/%3E%3C/svg%3E"
    />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="Black Dog Sala Prove" />
    <meta property="og:title" content="Black Dog — Sala Prove · Firenze" />
    <meta
      property="og:description"
      content="Spazi attrezzati per band, cantautori e produttori nel cuore di Firenze. Prenota online in pochi click."
    />
    <!-- TODO: sostituire con immagine reale 1200x630 in /public -->
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Black Dog — Sala Prove · Firenze" />
    <meta
      name="twitter:description"
      content="Spazi attrezzati per band, cantautori e produttori nel cuore di Firenze. Prenota online in pochi click."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.jpg" />

    <!-- Fonts: preconnect + load esplicito (no @import render-blocking) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>

    <noscript>Per utilizzare questa app è necessario abilitare JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
